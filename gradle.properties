org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.protocols=TLSv1.2,TLSv1.3
# org.gradle.java.home is deliberately not set here.
#
# It used to point at an Android Studio JBR on one Windows machine, which made
# the project unbuildable everywhere else — CI included — because the path does
# not exist there. A JDK location is a property of a machine, not of the
# project.
#
# If a particular JDK is needed locally (the original note said Android Studio's
# JBR avoided TLS handshake trouble with some OpenJDK 17 builds), put it in the
# per-user Gradle properties, which git does not see:
#
#   Windows  %USERPROFILE%\.gradle\gradle.properties
#   Unix     ~/.gradle/gradle.properties
#
#       org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
#
# Not local.properties: that file is read by the Android Gradle Plugin for
# sdk.dir, while org.gradle.java.home is a daemon option Gradle resolves before
# any plugin loads, so it would be ignored there.
