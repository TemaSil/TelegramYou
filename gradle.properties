org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.protocols=TLSv1.2,TLSv1.3
# org.gradle.java.home is deliberately not set here.
#
# It used to point at an Android Studio JBR on one Windows machine, which made
# the project unbuildable everywhere else — CI included — because the path does
# not exist there. A JDK location is a property of a machine, not of the
# project.
#
# If a particular JDK is needed locally (the original note said Android Studio's
# JBR avoided TLS handshake trouble with some OpenJDK 17 builds), set it in a
# file git does not track:
#
#   local.properties          org.gradle.java.home=/path/to/jdk
#   ~/.gradle/gradle.properties  same, for every project on the machine
