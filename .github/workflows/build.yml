# Compiles the app on every push, and publishes a debug APK for main.
#
# Without this nothing checks that the project builds: the Android SDK and
# Maven are not reachable from every environment the code is written in, so
# "it compiles" is otherwise an assumption rather than a fact.
name: Build

on:
  push:
    # Every branch, not a prefix. Branches are named after the work now — 
    # fix/outgoing-bubble-contrast rather than claude/some-generated-name — so
    # a pattern that listed prefixes would silently stop building the moment
    # somebody chose a new one. That happened within an hour of the rename.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push makes an in-flight build pointless.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages is pinned because the action's default includes `tools`, the
      # obsolete SDK Tools package Google has since removed from the
      # repository — sdkmanager fails to find it and the action dies before
      # exporting ANDROID_HOME. This broke builds that had been green for days
      # without a commit touching them.
      #
      # The compile platform is deliberately NOT listed here. Naming
      # platforms;android-37 made this step fail outright — "Failed to find
      # package" — even though sdkmanager --list shows android-37 in the
      # stable channel. AGP installs what compileSdk needs by itself, which
      # is how compileSdk 36 was satisfied before, so this stays out of its
      # way rather than duplicating it badly.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # What the repositories actually offer, as annotations.
      #
      # Neither Google's Maven nor Maven Central is reachable from every
      # environment this code is written in, so a version can otherwise only
      # be guessed at — and each guess costs a red build. Stable releases
      # only, because that is what this project pins.
      - name: Available versions
        if: always()
        run: |
          python3 - <<'PY'
          import re, urllib.request

          GOOGLE = "https://dl.google.com/dl/android/maven2"
          CENTRAL = "https://repo1.maven.org/maven2"

          COORDINATES = (
              ("compose-bom", GOOGLE, "androidx/compose/compose-bom"),
              ("material3", GOOGLE, "androidx/compose/material3/material3"),
              # Versioned with material3, not with the BOM, and pinned to the
              # same alpha — so what that alpha offers has to be readable
              # from here too.
              (
                  "navigation-suite",
                  GOOGLE,
                  "androidx/compose/material3/material3-adaptive-navigation-suite",
              ),
              ("AGP", GOOGLE, "com/android/tools/build/gradle"),
              ("kotlin", CENTRAL, "org/jetbrains/kotlin/kotlin-gradle-plugin"),
              # The Compose preview screenshot plugin, by its Gradle plugin
              # marker. Versioned independently of AGP, so which one pairs
              # with AGP 9 cannot be guessed from the AGP version.
              (
                  "screenshot-plugin",
                  GOOGLE,
                  "com/android/compose/screenshot/"
                  "com.android.compose.screenshot.gradle.plugin",
              ),
          )

          # -alpha, -beta, -rc, -dev and friends. A BOM's own date-shaped
          # version has no suffix, so this leaves it alone.
          PRERELEASE = re.compile(r"-(alpha|beta|rc|dev|M|eap)", re.IGNORECASE)

          boms = []
          for name, repo, path in COORDINATES:
              try:
                  xml = urllib.request.urlopen(
                      f"{repo}/{path}/maven-metadata.xml", timeout=60
                  ).read().decode()
              except Exception as exc:
                  print(f"::warning title={name}::could not be read: {exc}")
                  continue
              found = re.findall(r"<version>([^<]+)</version>", xml)
              stable = [v for v in found if not PRERELEASE.search(v)][-10:]
              # This one has only ever shipped alphas; showing "stable" for it
              # would print an empty list and say nothing.
              shown = stable if stable else found[-10:]
              print(f"::notice title={name}::" + ", ".join(shown))
              print(f"{name}: latest {found[-1]}, shown {shown}")
              if name == "compose-bom":
                  boms = [v for v in found if not PRERELEASE.search(v)][-30:]

          # Which material3 each BOM pins. A BOM constrains versions without
          # naming them anywhere readable, and the difference decides how much
          # else has to move: a BOM is only worth taking if its Compose core
          # does not also demand a new compileSdk and AGP.
          pairs = []
          for bom in boms:
              try:
                  pom = urllib.request.urlopen(
                      f"{GOOGLE}/androidx/compose/compose-bom/{bom}"
                      f"/compose-bom-{bom}.pom", timeout=60
                  ).read().decode()
              except Exception as exc:
                  print(f"::warning title={bom}::pom could not be read: {exc}")
                  continue
              block = re.search(
                  r"<artifactId>material3</artifactId>\s*"
                  r"<version>([^<]+)</version>", pom
              )
              core = re.search(
                  r"<artifactId>ui</artifactId>\s*<version>([^<]+)</version>",
                  pom
              )
              pairs.append(
                  f"{bom} -> material3 {block.group(1) if block else '?'}"
                  f" / ui {core.group(1) if core else '?'}"
              )
          for pair in pairs:
              print(pair)
          print("::notice title=BOM contents::" + "; ".join(pairs))

          # What the newest material3 alphas need underneath them.
          #
          # Material 3 Expressive is not public in any stable material3 —
          # MaterialExpressiveTheme, MotionScheme and LoadingIndicator are all
          # internal in 1.4.0 — so reaching it means an alpha, and an alpha
          # drags its own Compose core along. This prints what that core is,
          # which decides whether the rest of the build has to move too.
          try:
              xml = urllib.request.urlopen(
                  f"{GOOGLE}/androidx/compose/material3/material3"
                  "/maven-metadata.xml", timeout=60
              ).read().decode()
              alphas = re.findall(r"<version>([^<]+)</version>", xml)
              alphas = [v for v in alphas if v.startswith("1.5.0-alpha")][-3:]
          except Exception as exc:
              print(f"::warning title=material3 alphas::{exc}")
              alphas = []

          for version in alphas:
              try:
                  pom = urllib.request.urlopen(
                      f"{GOOGLE}/androidx/compose/material3/material3/{version}"
                      f"/material3-{version}.pom", timeout=60
                  ).read().decode()
              except Exception as exc:
                  print(f"::warning title={version}::pom: {exc}")
                  continue
              needs = re.findall(
                  r"<artifactId>(compose-)?(ui|foundation|runtime)[^<]*"
                  r"</artifactId>\s*<version>([^<]+)</version>", pom
              )
              seen = sorted({f"{m[1]} {m[2]}" for m in needs})
              print(f"::notice title={version} needs::" + ", ".join(seen))
              print(f"{version} needs {seen}")
          PY

      # No credentials here: without TELEGRAM_API_ID the build selects the
      # demo backend, which is what a CI build should exercise anyway.
      # timeout-minutes because nothing else bounds this. A wedged Gradle
      # would otherwise hold the runner for six hours; fifteen minutes is
      # generous for a build that takes about two.
      #
      # Output is left alone. An earlier version filtered --info through grep
      # to diagnose a stall that turned out never to have happened — the runs
      # in question were cancelled by this workflow's own cancel-in-progress,
      # not stuck — and filtering only stood between a failure and its
      # explanation.
      - name: Assemble debug
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-log.txt

      # What the alpha's navigation suite declares.
      #
      # Temporary. NavigationSuiteScaffold's Expressive overloads — the ones
      # that can draw a ShortNavigationBar rather than the classic one — are
      # experimental in a library that is itself an alpha, so their
      # parameters cannot be read from anywhere this code is written. javap
      # gives the types and the order; it does not give parameter names.
      #
      # Delete once the navigation suite compiles.
      - name: Probe the navigation suite API
        if: always()
        run: |
          # Resolution first. A cached compile never downloads the artifact,
          # which is how the first run of this printed an empty path and said
          # nothing at all.
          ./gradlew -q :app:dependencies \
            --configuration debugCompileClasspath > /dev/null 2>&1 || true
          home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          find "$home" -name '*navigation-suite*' | head -20
          aar=$(find "$home" -name '*navigation-suite*.aar' | head -1)
          echo "aar: $aar"
          if [ -z "$aar" ]; then
            echo "::warning title=Probe::no navigation-suite aar in $home"
            exit 0
          fi
          work=$(mktemp -d)
          unzip -o -q "$aar" classes.jar -d "$work"
          for class in \
              androidx.compose.material3.adaptive.navigationsuite.NavigationSuiteScaffoldKt \
              androidx.compose.material3.adaptive.navigationsuite.NavigationSuiteType \
              androidx.compose.material3.adaptive.navigationsuite.NavigationSuiteScaffoldDefaults \
              androidx.compose.material3.adaptive.navigationsuite.NavigationSuiteScope; do
            echo "=== $class"
            javap -classpath "$work/classes.jar" "$class" 2>&1 | head -40
          done

      # A BOM pins versions without naming them, and material3 is pinned past
      # the BOM on top of that, so "which Expressive is this" is otherwise a
      # dependency tree read by hand.
      - name: Resolved Compose versions
        if: always()
        run: |
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath \
            > deps.txt || true
          for lib in androidx.compose.material3:material3 \
                     androidx.compose.foundation:foundation \
                     androidx.compose.ui:ui; do
            found=$(grep -o "$lib:[0-9][^ ]*" deps.txt | sort -u | tail -1)
            [ -n "$found" ] && echo "::notice title=Resolved::$found"
          done

      # Appended to the same log, so a test source set that fails to compile
      # is reported by the Compile errors step below just like the app's.
      #
      # assembleDebugAndroidTest compiles the instrumentation tests without
      # running them. They only run on an emulator, in the UI workflow, which
      # takes twenty minutes — so without this a typo in a UI test would be
      # found there, after a boot and an install, rather than here.
      #
      # timeout-minutes because a test that hangs has no other bound. One did:
      # a progress ticker looping on state nothing in a unit test ever clears.
      # Without this the job sits on the runner until GitHub's six-hour limit.
      - name: Unit tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          ./gradlew :core:check :app:testDebugUnitTest :app:assembleDebugAndroidTest \
            --stacktrace 2>&1 | tee -a build-log.txt

      # Without this a green "Unit tests" step is ambiguous: Gradle reports
      # success when it runs no tests at all.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/**/*.xml
            core/build/test-results/**/*.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Last, so both numbers and errors land where the log tail can be read.
      #
      # A green "Unit tests" step proves nothing on its own: Gradle reports
      # success when it runs no tests at all, and the artifact cannot be
      # downloaded from every environment. Failing here on an empty run turns
      # a green build into evidence that tests actually executed.
      #
      # The compile errors are reported from the same step for the same
      # reason. A Kotlin error arrives wrapped in a Gradle stack trace two
      # hundred frames deep, and the one line that says what is wrong scrolls
      # past long before the end. Pulled out here, both the count and the
      # errors sit in the last few lines of the log — and as annotations, for
      # anyone reading the checks tab instead.
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, pathlib, re, sys, xml.etree.ElementTree as ET

          # Compile errors first, so the test count stays the last line.
          log = pathlib.Path('build-log.txt')
          # Continuation lines are kept, and that is the point. Kotlin reports
          # an unresolved overload as "none of the following candidates is
          # applicable" followed by the candidates, indented and with no
          # prefix — so taking only `e:` lines throws away the half that says
          # what the right call would have been. It did, once, and cost a
          # round.
          errors = []
          following = False
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if line.startswith('e: '):
                      # The runner's absolute path is noise; the repo path is not.
                      cleaned = re.sub(
                          r'^file://\S*?/(?=app/|core/)', '', line[3:].strip()
                      )
                      following = True
                  elif following and line.startswith(('    ', '\t')):
                      cleaned = '    ' + line.strip()
                  else:
                      following = False
                      continue
                  if cleaned not in errors:
                      errors.append(cleaned)

          for error in errors[:60]:
              # Only the error lines become annotations; a candidate list is
              # context for the line above it, not sixty separate problems.
              if not error.startswith('    '):
                  print(f"::error title=Compile error::{error}")
              print(error)
          if len(errors) > 60:
              print(f"::error::and {len(errors) - 60} more")

          files = (glob.glob('app/build/test-results/**/*.xml', recursive=True)
                   + glob.glob('core/build/test-results/**/*.xml', recursive=True))
          total = failed = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              if root.tag != 'testsuite':
                  continue
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              print(f"  {root.get('name')}: {root.get('tests')} tests, "
                    f"{root.get('failures')} failures, {root.get('errors')} errors")

          # A notice, not just stdout: post-job steps bury the tail of the log,
          # but annotations stay readable through the check-runs API.
          print(f"::notice title=Unit tests::{total} tests, "
                f"{failed} failed, {skipped} skipped")
          print(f"TOTAL: {total} tests, {failed} failed, {skipped} skipped")

          if errors:
              # Naming the real cause: the tests did not run because nothing
              # compiled, and "no tests ran" would send the next reader looking
              # in the wrong place.
              print(f"::error::{len(errors)} compile error(s); see above.")
              sys.exit(1)
          if total == 0:
              print("::error::No tests ran. A green build must mean tests executed.")
              sys.exit(1)
          if failed:
              sys.exit(1)
          PY

      # A workflow artifact is behind a login and expires in ninety days, so
      # "where is the APK" had no good answer. A release does: the file keeps
      # one URL, /releases/latest/download/, which the README can point at and
      # which does not rot.
      #
      # Only from main, and only when everything above passed — Summary is the
      # step that fails a build with no tests, so this sits after it.
      #
      # The tag is moved rather than added to. One rolling "latest" is what
      # makes the download URL stable; every green main would otherwise leave
      # a release nobody asked for.
      # One stable filename, whatever the version inside is called.
      #
      # The APK is named after its versionName, which now moves with every
      # build — so uploading it as built would leave the `latest` release
      # holding one asset per push, and the download link in the README would
      # break on each one. The version is in the release's own name, in the
      # body, and in the app's entry in Android settings.
      - name: Name the APK for the release
        if: success() && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/*.apk TelegramYou-debug.apk
          echo "VERSION=$(ls app/build/outputs/apk/debug/*.apk \
            | sed -E 's#.*/TelegramYou-(.*)-debug\.apk#\1#')" >> "$GITHUB_ENV"

      # Everything in the release that is not the current APK.
      #
      # The asset used to be named after the version, so the versions
      # published before this workflow settled on one fixed name are still
      # sitting in the release — offering whoever opens the page a choice
      # between the build of today and a build of whenever, with nothing to
      # say which is which. There is only ever one APK worth having here.
      - name: Remove stale release assets
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          # No release yet on the very first run, which is not a failure.
          ids=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/tags/latest" \
            | python3 -c "
          import json, sys
          try:
              release = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          for asset in release.get('assets', []):
              if asset['name'] != 'TelegramYou-debug.apk':
                  print(asset['id'])
          " || true)
          for id in $ids; do
            echo "Deleting stale asset $id"
            curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "$api/releases/assets/$id" || true
          done

      - name: Publish the APK
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TelegramYou ${{ env.VERSION }}
          files: TelegramYou-debug.apk
          # Not a prerelease: /releases/latest resolves only to a full one,
          # and that path is the entire point.
          prerelease: false
          make_latest: true
          body: |
            The newest build of `main`, rebuilt on every push.

            **This is the demo build.** It has the whole interface and no
            account: the login code is `12345` and nothing leaves the phone.
            CI cannot build the live client — the Telegram `api_id` and
            `api_hash` are deliberately not in this repository, and TDLib's
            native libraries are too large for git. Live mode is a local
            build; see the README.

            Debug-signed, so Android will ask you to allow installing from
            this source. Version `${{ env.VERSION }}`, built from
            ${{ github.sha }}.

            The file name is the same every build so the link above keeps
            working; which build it is shows in the release title and in the
            app's own entry under Android settings.
