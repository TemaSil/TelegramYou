# Compiles the app on every push, and publishes a debug APK for main.
#
# Without this nothing checks that the project builds: the Android SDK and
# Maven are not reachable from every environment the code is written in, so
# "it compiles" is otherwise an assumption rather than a fact.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push makes an in-flight build pointless.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages is pinned because the action's default includes `tools`, the
      # obsolete SDK Tools package Google has since removed from the
      # repository — sdkmanager fails to find it and the action dies before
      # exporting ANDROID_HOME. This broke builds that had been green for days
      # without a commit touching them.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # No credentials here: without TELEGRAM_API_ID the build selects the
      # demo backend, which is what a CI build should exercise anyway.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Without this a green "Unit tests" step is ambiguous: Gradle reports
      # success when it runs no tests at all.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Last, so the numbers land where the log tail can be read.
      #
      # A green "Unit tests" step proves nothing on its own: Gradle reports
      # success when it runs no tests at all, and the artifact cannot be
      # downloaded from every environment. Failing here on an empty run turns
      # a green build into evidence that tests actually executed.
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = failed = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              if root.tag != 'testsuite':
                  continue
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              print(f"  {root.get('name')}: {root.get('tests')} tests, "
                    f"{root.get('failures')} failures, {root.get('errors')} errors")

          # A notice, not just stdout: post-job steps bury the tail of the log,
          # but annotations stay readable through the check-runs API.
          print(f"::notice title=Unit tests::{total} tests, "
                f"{failed} failed, {skipped} skipped")
          print(f"TOTAL: {total} tests, {failed} failed, {skipped} skipped")
          if total == 0:
              print("::error::No tests ran. A green build must mean tests executed.")
              sys.exit(1)
          if failed:
              sys.exit(1)
          PY
