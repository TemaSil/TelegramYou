# Compiles the app on every push, and publishes a debug APK for main.
#
# Without this nothing checks that the project builds: the Android SDK and
# Maven are not reachable from every environment the code is written in, so
# "it compiles" is otherwise an assumption rather than a fact.
name: Build

on:
  push:
    # Work happens on claude/* branches before it reaches main, and an
    # unbuilt branch is not worth reviewing.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push makes an in-flight build pointless.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages is pinned because the action's default includes `tools`, the
      # obsolete SDK Tools package Google has since removed from the
      # repository — sdkmanager fails to find it and the action dies before
      # exporting ANDROID_HOME. This broke builds that had been green for days
      # without a commit touching them.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # What the repositories actually offer, as annotations.
      #
      # Neither Google's Maven nor Maven Central is reachable from every
      # environment this code is written in, so a version can otherwise only
      # be guessed at — and each guess costs a red build. Stable releases
      # only, because that is what this project pins.
      - name: Available versions
        if: always()
        run: |
          python3 - <<'PY'
          import re, urllib.request

          GOOGLE = "https://dl.google.com/dl/android/maven2"
          CENTRAL = "https://repo1.maven.org/maven2"

          COORDINATES = (
              ("compose-bom", GOOGLE, "androidx/compose/compose-bom"),
              ("material3", GOOGLE, "androidx/compose/material3/material3"),
              ("AGP", GOOGLE, "com/android/tools/build/gradle"),
              ("kotlin", CENTRAL, "org/jetbrains/kotlin/kotlin-gradle-plugin"),
          )

          # -alpha, -beta, -rc, -dev and friends. A BOM's own date-shaped
          # version has no suffix, so this leaves it alone.
          PRERELEASE = re.compile(r"-(alpha|beta|rc|dev|M|eap)", re.IGNORECASE)

          boms = []
          for name, repo, path in COORDINATES:
              try:
                  xml = urllib.request.urlopen(
                      f"{repo}/{path}/maven-metadata.xml", timeout=60
                  ).read().decode()
              except Exception as exc:
                  print(f"::warning title={name}::could not be read: {exc}")
                  continue
              found = re.findall(r"<version>([^<]+)</version>", xml)
              stable = [v for v in found if not PRERELEASE.search(v)][-10:]
              print(f"::notice title={name} (stable)::" + ", ".join(stable))
              print(f"{name}: latest {found[-1]}, stable {stable}")
              if name == "compose-bom":
                  boms = [v for v in found if not PRERELEASE.search(v)][-30:]

          # Which material3 each BOM pins. A BOM constrains versions without
          # naming them anywhere readable, and the difference decides how much
          # else has to move: a BOM is only worth taking if its Compose core
          # does not also demand a new compileSdk and AGP.
          pairs = []
          for bom in boms:
              try:
                  pom = urllib.request.urlopen(
                      f"{GOOGLE}/androidx/compose/compose-bom/{bom}"
                      f"/compose-bom-{bom}.pom", timeout=60
                  ).read().decode()
              except Exception as exc:
                  print(f"::warning title={bom}::pom could not be read: {exc}")
                  continue
              block = re.search(
                  r"<artifactId>material3</artifactId>\s*"
                  r"<version>([^<]+)</version>", pom
              )
              core = re.search(
                  r"<artifactId>ui</artifactId>\s*<version>([^<]+)</version>",
                  pom
              )
              pairs.append(
                  f"{bom} -> material3 {block.group(1) if block else '?'}"
                  f" / ui {core.group(1) if core else '?'}"
              )
          for pair in pairs:
              print(pair)
          print("::notice title=BOM contents::" + "; ".join(pairs))
          PY

      # No credentials here: without TELEGRAM_API_ID the build selects the
      # demo backend, which is what a CI build should exercise anyway.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # A BOM pins versions without naming them, so "which material3 is this"
      # is otherwise unanswerable without reading a dependency tree by hand.
      - name: Resolved Compose versions
        if: always()
        run: |
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath \
            > deps.txt || true
          for lib in androidx.compose.material3:material3 \
                     androidx.compose.foundation:foundation \
                     androidx.compose.ui:ui; do
            found=$(grep -o "$lib:[0-9][^ ]*" deps.txt | sort -u | tail -1)
            [ -n "$found" ] && echo "::notice title=Resolved::$found"
          done

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Without this a green "Unit tests" step is ambiguous: Gradle reports
      # success when it runs no tests at all.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Last, so the numbers land where the log tail can be read.
      #
      # A green "Unit tests" step proves nothing on its own: Gradle reports
      # success when it runs no tests at all, and the artifact cannot be
      # downloaded from every environment. Failing here on an empty run turns
      # a green build into evidence that tests actually executed.
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = failed = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              if root.tag != 'testsuite':
                  continue
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              print(f"  {root.get('name')}: {root.get('tests')} tests, "
                    f"{root.get('failures')} failures, {root.get('errors')} errors")

          # A notice, not just stdout: post-job steps bury the tail of the log,
          # but annotations stay readable through the check-runs API.
          print(f"::notice title=Unit tests::{total} tests, "
                f"{failed} failed, {skipped} skipped")
          print(f"TOTAL: {total} tests, {failed} failed, {skipped} skipped")
          if total == 0:
              print("::error::No tests ran. A green build must mean tests executed.")
              sys.exit(1)
          if failed:
              sys.exit(1)
          PY
