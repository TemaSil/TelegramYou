# Runs the app on a real Android runtime, and brings back pictures.
#
# The Build workflow proves the code compiles and that pure logic behaves.
# What neither it nor any unit test can say is whether a screen appears at
# all — every composable in this project is written without a device, and the
# first time anyone found out that the chat list crashed after login was by
# installing the APK by hand.
#
# So this boots an emulator, drives the demo client from a cold start to the
# chat list, and pushes the screenshots to a branch. A branch rather than an
# artifact because artifacts need a login to fetch and expire in ninety days,
# while a branch can simply be cloned.
name: UI

on:
  # Not on every push: an emulator takes minutes where the Build workflow
  # takes one, and the fast loop is worth keeping fast.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # To find the Build run of the same commit, whose number is the version
  # the gallery files these screens under.
  actions: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes an x86_64 emulator usable rather than an hour of
      # ARM interpretation. GitHub's ubuntu runners have it; it just needs to
      # be readable by the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          # Everything that would otherwise be drawn over the app, or would
          # slow the boot to no purpose.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat > logcat-full.txt &
            # The demo client whatever the repository has configured: the
            # smoke test signs in with 12345 and drives the demo's chats.
            ./gradlew :app:connectedDebugAndroidTest -PdemoClient=true --stacktrace || echo failed > failed.marker
            # Pulled whether or not the test passed: a screenshot of the wrong
            # screen is the most useful thing there is when it failed.
            # Nothing is pulled off the device: the screenshots go through
            # TestStorage, and AGP collects them into build/outputs by itself.
            # Pulling from the app's own directory does not work — Gradle
            # uninstalls the APK, and its files go with it.

      # Everything worth reading, gathered into one directory.
      #
      # The instrumentation report is the useful artefact and not logcat: it
      # names the test, the assertion and the stack trace. Logcat is kept only
      # for the app's own fatal exceptions, because grepping it for the package
      # name returns three hundred lines of the package manager installing and
      # uninstalling the app.
      - name: Gather the evidence
        if: always()
        run: |
          mkdir -p evidence/screenshots
          cp -r app/build/outputs/androidTest-results/connected/. evidence/results/ \
            2>/dev/null || true
          # Wherever AGP decided to put what TestStorage held. The path has a
          # device name in it, so it is found rather than spelled out.
          find app/build/outputs -name '*.png' -exec cp {} evidence/screenshots/ \; \
            2>/dev/null || true
          # Accessibility trees a test chose to keep, next to the pictures of
          # the same moment: what UiAutomator — and so TalkBack — could see.
          mkdir -p evidence/hierarchy
          find app/build/outputs -name 'hierarchy-*.xml' \
            -exec cp {} evidence/hierarchy/ \; 2>/dev/null || true
          # A fatal exception and the forty lines under it, which is the trace.
          if [ -f logcat-full.txt ]; then
            grep -A 40 "FATAL EXCEPTION" logcat-full.txt > evidence/crash.txt 2>/dev/null || true
            [ -s evidence/crash.txt ] || rm -f evidence/crash.txt
          fi
          echo "--- gathered ---"
          find evidence -type f | sort

      # Pushed rather than uploaded. An artifact needs a GitHub session to
      # fetch and expires in ninety days; a branch can simply be cloned, which
      # is what makes this readable from a machine that only has git.
      - name: Publish the evidence
        if: always()
        run: |
          if [ -z "$(find evidence -type f 2>/dev/null)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch, rewritten each run: this is the current state of
          # the screens, not a history of them, and PNGs accumulate fast.
          git checkout --orphan ui-screenshots
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name . -not -name .git -not -name evidence \
            -exec rm -rf {} + 2>/dev/null || true
          {
            echo "# What the app looked like"
            echo
            echo "From commit ${GITHUB_SHA}, run ${GITHUB_RUN_ID}."
            echo "Rewritten on every run of the UI workflow."
            echo
            echo '- `evidence/screenshots/` — one per step of the smoke test'
            echo '- `evidence/results/` — the instrumentation report, including'
            echo '  the stack trace of anything that failed'
            echo '- `evidence/crash.txt` — the app'"'"'s own fatal exceptions, if any'
          } > README.md
          git add -A
          git commit -q -m "Screens at ${GITHUB_SHA}"
          git push -f origin ui-screenshots

      # Last, and this is the point. Two versions of this have now reported
      # success on a run where the app never reached the chat list.
      #
      # The first swallowed the failure with `|| echo marker` and never looked
      # at the marker. The second looked at the marker — but AGP 9 does not
      # fail the Gradle invocation when an instrumentation test fails. It
      # writes failures="1" into the report, writes 1 into
      # test-result-exit-code.txt, and exits 0. So the marker was never
      # written, and a red test was reported green a second time.
      #
      # The report is therefore the authority, not Gradle's exit code — the
      # same rule the Build workflow already applies to unit tests. A run with
      # no tests in it fails too: an emulator that never got as far as running
      # anything must not look like a pass.
      - name: Did the app actually work
        if: always()
        run: |
          if [ -f evidence/crash.txt ]; then
            echo "The app crashed. First fatal exception:"
            head -30 evidence/crash.txt
          fi
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          total = failed = 0
          for path in glob.glob('evidence/results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for suite in root.iter('testsuite'):
                  total += int(suite.get('tests', 0))
                  failed += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
              for case in root.iter('testcase'):
                  for problem in list(case.iter('failure')) + list(case.iter('error')):
                      print(f"::error title={case.get('name')}::"
                            + (problem.text or '').strip().splitlines()[0])
                      print((problem.text or '').strip())

          print(f"::notice title=Emulator::{total} tests, {failed} failed")
          if total == 0:
              print("::error::No instrumentation tests ran.")
              sys.exit(1)
          if failed:
              print("::error::The smoke test failed. See the ui-screenshots branch.")
              sys.exit(1)
          print("The app started, signed in and reached the chat list.")
          PY

      # The front page's pictures, and the record of how they changed.
      #
      # `ui-screenshots` above is rewritten every run, which is right for
      # "what does it look like now" and useless for "what did it look like
      # three releases ago". This keeps a chosen few from every green build
      # of main in the `gallery` branch, under the version the Build
      # workflow gave the same commit, and refreshes `latest/`, which is what
      # README.md shows. Green only: a failed run's screens are of whatever
      # went wrong, and the front page is not the place for them.
      #
      # The script is read out of the commit rather than the working tree,
      # because the step above has left the working tree on the orphan
      # evidence branch with nothing but the evidence in it.
      - name: File the screens in the gallery
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          run=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
            --jq '.workflow_runs[0].run_number // empty' || true)
          if [ -n "$run" ]; then version="0.2.${run}"; else version="${GITHUB_SHA::7}"; fi
          echo "Filing the screens as ${version}"

          git show "${GITHUB_SHA}:.github/scripts/gallery.py" > "${RUNNER_TEMP}/gallery.py"
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet pillow

          work="${RUNNER_TEMP}/gallery"
          git fetch --quiet --depth 1 origin gallery
          git worktree add --quiet --detach "$work" FETCH_HEAD
          "${RUNNER_TEMP}/venv/bin/python" "${RUNNER_TEMP}/gallery.py" \
            evidence/screenshots "$work" "$version" "$GITHUB_SHA"
          cd "$work"
          git add -A
          git commit --quiet -m "Screens of ${version}"
          # No retry for a push that lost a race: the concurrency group above
          # cancels one main run when the next starts, so two never get here.
          git push --quiet origin HEAD:gallery
