# Installs a published release APK on a clean emulator and says, in
# Android's own words, whether it goes on and whether it starts.
#
# A phone's installer reports most failures as "App not installed as
# package appears to be invalid" and nothing more. `adb install` names the
# actual reason (INSTALL_PARSE_FAILED_…, INSTALL_FAILED_…), and apksigner
# and aapt2 from the runner's SDK say what the file itself looks like. All
# of it comes back as check-run annotations, readable without the log.
#
# Run by hand, with the release tag to check; it also runs on pushes to
# ci/install-check, which is how a session without the Actions UI starts it.
name: Install check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose TelegramYou.apk to install
        default: v1.1
  push:
    branches: ['ci/install-check']

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'v1.1' }}
    steps:
      - name: Fetch the APK
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern TelegramYou.apk
          # The debug build too, installed first, as it is on a phone that
          # already has it.
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern TelegramYou-debug.apk
          ls -l TelegramYou.apk
          echo "::notice title=APK::$TAG, $(stat -c %s TelegramYou.apk) bytes, sha256 $(sha256sum TelegramYou.apk | cut -c1-16)"

      # The runner image ships an Android SDK with build-tools; the newest
      # one there is enough to read any APK.
      - name: What the file says
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          "$bt/apksigner" verify --verbose --print-certs TelegramYou.apk 2>&1 | tee apksigner.txt || true
          echo "::notice title=apksigner::$(grep -v '^WARNING' apksigner.txt | grep -iv 'digest\|certificate DN\|key size\|key algorithm' | tr '\n' ' ' | cut -c1-900)"
          "$bt/aapt2" dump badging TelegramYou.apk 2>&1 | head -12 | tee badging.txt || true
          echo "::notice title=aapt2::$(head -4 badging.txt | tr '\n' ' ' | cut -c1-900)"
          "$bt/zipalign" -c -P 16 -v 4 TelegramYou.apk > zipalign.txt 2>&1 && res=ok || res=failed
          echo "::notice title=zipalign -P 16::${res}: $(grep -v 'OK' zipalign.txt | tail -4 | tr '\n' ' ' | cut -c1-600)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 15 and 16, as phones that refused it run. Each line of the
      # script runs on its own, so each one stands alone.
      - name: Install and start it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install TelegramYou-debug.apk > debug.txt 2>&1 || true
            echo "::notice title=API ${{ matrix.api }} debug first::$(tr '\n' ' ' < debug.txt | cut -c1-300)"
            adb install TelegramYou.apk > install.txt 2>&1 || true
            echo "::notice title=API ${{ matrix.api }} adb install::$(tr '\n' ' ' < install.txt | cut -c1-900)"
            adb logcat -c
            adb shell am start -W -n com.telegramyou.app/.MainActivity > start.txt 2>&1 || true
            sleep 15
            echo "::notice title=API ${{ matrix.api }} am start::$(tr '\n' ' ' < start.txt | cut -c1-600) pid=$(adb shell pidof com.telegramyou.app)"
            adb logcat -d -b crash > crash.txt 2>&1 || true
            echo "::notice title=API ${{ matrix.api }} crash buffer::$(tr '\n' ' ' < crash.txt | cut -c1-1500)"

  # Two release builds, each one step from the real one, published as the
  # `probe` prerelease for a phone to try: A under another id with the
  # release key, B under the real id with the debug key. Which installs
  # says whether the phone objects to the key, to something already holding
  # the id, or to the build itself.
  probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the probes
        timeout-minutes: 40
        run: |
          set -e
          ./gradlew :app:assembleRelease -PprobeIdSuffix=.probe
          cp app/build/outputs/apk/release/*-release.apk TelegramYou-probe-A.apk
          ./gradlew :app:assembleRelease -PprobeDebugKey=true
          cp app/build/outputs/apk/release/*-release.apk TelegramYou-probe-B.apk
          ls -l TelegramYou-probe-*.apk

      - name: Publish the probes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe
          target_commitish: ${{ github.sha }}
          name: Install probes
          prerelease: true
          make_latest: false
          files: |
            TelegramYou-probe-A.apk
            TelegramYou-probe-B.apk
          body: |
            Not a release. Two builds for finding out why a phone refused v1.1:
            A is the release under another id (com.telegramyou.app.probe) with the release key;
            B is the release under its own id with the debug key. Uninstall both afterwards.
